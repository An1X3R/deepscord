<section id="theme-industrial" class="theme-workstation" data-density="comfortable" aria-label="工程站开放主题">
  <header class="theme-workstation-header">
    <div class="theme-workstation-identity"><span class="theme-workstation-index" aria-hidden="true">01 /</span><div><p class="theme-workstation-eyebrow">DEEPSCORD / 工作台</p><h1 id="theme-industrial-server">工程站</h1></div></div>
    <div class="theme-workstation-status"><span id="theme-industrial-status" role="status">正在连接</span><span id="theme-industrial-count">0 位成员</span></div>
    <div class="theme-workstation-actions"><button id="theme-industrial-density" type="button" data-theme-action="toggle-density" aria-pressed="false">紧凑排布</button><button id="theme-industrial-settings" type="button" data-theme-action="settings">设置</button></div>
  </header>
  <div class="theme-workstation-rail" data-deepscord-slot="rail"></div>
  <aside class="theme-workstation-directory"><div class="theme-workstation-section-label">频道 / DIRECTORY</div><div data-deepscord-slot="sidebar"></div></aside>
  <section class="theme-workstation-main" aria-label="当前频道"><div data-deepscord-slot="topbar"></div><div data-deepscord-slot="radio"></div><div data-deepscord-slot="content"></div></section>
  <aside class="theme-workstation-members" aria-label="房间成员"><div class="theme-workstation-section-label">在线 / PRESENCE</div><div data-deepscord-slot="members"></div></aside>
  <footer class="theme-workstation-footer"><span id="theme-industrial-channel">等待频道</span><div data-deepscord-slot="self"></div></footer>
</section>
