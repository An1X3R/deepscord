# Coturn REST authentication: https://github.com/coturn/coturn/blob/master/README.turnserver
# Docker supplies static-auth-secret through the command line at startup.
# For a standalone installation, add static-auth-secret=<strong secret> in a
# restricted local config outside the repository; use the same TURN_SECRET
# in deepscord. Never configure static user/password accounts.
# Set ECHO_PASSWORD and explicitly select relay-allowed or relay-only in deepscord.
# TURN_TTL_SECONDS defaults to 3600; accepted explicit values are 60..86400.
# Open 3478/tcp+udp and 49160-49200/udp. This example runs on a public-IP host.
# Behind NAT, set external-ip=PUBLIC_IP/PRIVATE_IP and forward these ports.

listening-port=3478
fingerprint
use-auth-secret
realm=deepscord
log-file=stdout

min-port=49160
max-port=49200
no-multicast-peers
denied-peer-ip=0.0.0.0-0.255.255.255
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=100.64.0.0-100.127.255.255
denied-peer-ip=127.0.0.0-127.255.255.255
denied-peer-ip=169.254.0.0-169.254.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.168.0.0-192.168.255.255
denied-peer-ip=::1
denied-peer-ip=fc00::-fdff:ffff:ffff:ffff:ffff:ffff:ffff:ffff
denied-peer-ip=fe80::-febf:ffff:ffff:ffff:ffff:ffff:ffff:ffff
user-quota=12
total-quota=100
no-cli
no-tls
no-dtls
