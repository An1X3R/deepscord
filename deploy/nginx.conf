# Deepscord · Nginx 反向代理示例（不用 Docker / Caddy 时）
#
# 1. 把项目放到 /opt/deepscord，用 systemd 启动（见 deepscord.service）
# 2. 把这个文件放进 /etc/nginx/conf.d/deepscord.conf，改域名与证书路径
# 3. nginx -t && systemctl reload nginx
#
# WebSocket 的关键是 Upgrade/Connection 两个头 + 足够长的 read_timeout。

server {
    listen 80;
    listen [::]:80;
    server_name voice.example.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name voice.example.com;

    ssl_certificate     /etc/letsencrypt/live/voice.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/voice.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:DeepscordTLS:10m;

    client_max_body_size 2m;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;

        # WebSocket 升级
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 语音信令连接是长连接
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }
}
