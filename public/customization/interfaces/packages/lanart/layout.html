<section id="theme-lanart" class="theme-lanart" data-art-mode="night" data-density="comfortable" data-directory="closed" data-switching="false" aria-label="Lanart 测绘与星轨双模态主题">
  <!-- Background Art Adapter: Day Survey Atlas + Night Orbital Observatory -->

          <stop offset="1" stop-color="#b9cbe8" />

        <pattern id="theme-lanart-day-lattice" width="48" height="48" patternUnits="userSpaceOnUse">

          <path class="lanart-day-lattice-cross" d="M-3 -3L3 3M3 -3L-3 3" />

        <path class="lanart-land-4" d="M1080 -48h456v96h-456ZM1128 48h408v96h-408ZM1200 144h336v96h-336Z" />
      </g>

      <!-- Tilted Survey Plate Frames -->
      <g class="lanart-day-frames">
        <rect class="lanart-plate-wash" x="718" y="84" width="520" height="300" transform="rotate(-7 978 234)" />
        <rect class="lanart-plate-paper" x="700" y="70" width="520" height="300" transform="rotate(-7 960 220)" />
        <rect class="lanart-plate-line" x="1140" y="42" width="300" height="200" transform="rotate(4 1290 142)" />
      </g>

      <!-- Rotated 32deg Diamond Tile Field -->
      <g class="lanart-day-tiles">
        <path class="lanart-tile-blue" d="M732.1 178.4L771.1 202.8L746.7 241.8L707.7 217.4Z" />
        <path class="lanart-tile-blue" d="M852.4 202.1L891.4 226.5L867.0 265.5L828.0 241.1Z" />
        <path class="lanart-tile-blue" d="M956.2 146.2L995.2 170.6L970.8 209.6L931.8 185.2Z" />
        <path class="lanart-tile-blue" d="M1042.5 224.0L1081.5 248.4L1057.1 287.4L1018.1 263.0Z" />
        <path class="lanart-tile-pale" d="M680.5 226.0L719.5 250.4L695.1 289.4L656.1 265.0Z" />
        <path class="lanart-tile-pale" d="M794.0 132.0L833.0 156.4L808.6 195.4L769.6 171.0Z" />
        <path class="lanart-tile-pale" d="M902.8 258.4L941.8 282.8L917.4 321.8L878.4 297.4Z" />

        <path class="lanart-tile-outline" d="M642.0 154.0L681.0 178.4L656.6 217.4L617.6 193.0ZM828.0 96.0L867.0 120.4L842.6 159.4L803.6 135.0ZM1064.0 108.0L1103.0 132.4L1078.6 171.4L1039.6 147.0Z" />
      </g>

      <!-- Guide Circle & Joined Compass Ticks -->
      <g class="lanart-day-guide">
        <circle class="lanart-guide-circle" cx="640" cy="150" r="170" />
        <path class="lanart-guide-arc" d="M640 -20 A170 170 0 0 1 810 150" />
        <path class="lanart-guide-ticks" d="M810 150h-14M640 320v-14M470 150h14M787.2 235l-12.1-7M725 297.2l-7-12.1M555 297.2l7-12.1M492.8 235l12.1-7M492.8 65l12.1 7M555 2.8l7 12.1M725 2.8l-7 12.1M787.2 65l-12.1 7" />
      </g>

      <!-- Survey Route Polylines, Waypoint Nodes & Tag Plates -->
      <polyline class="lanart-route-ghost" points="380,300 610,250 830,330 1050,260 1290,340" />
      <polyline class="lanart-route-main" points="520,190 720,140 905,225 1105,150 1305,235" />
      <polyline class="lanart-route-crawl" points="520,190 720,140 905,225 1105,150 1305,235" />
      <polyline class="lanart-route-survey" points="905,225 960,300 1110,318 1250,290" />

      <g class="lanart-route-nodes">
        <rect class="lanart-node-sq" x="514" y="184" width="12" height="12" /><rect class="lanart-node-core" x="517.5" y="187.5" width="5" height="5" />
        <rect class="lanart-node-sq" x="714" y="134" width="12" height="12" /><rect class="lanart-node-core" x="717.5" y="137.5" width="5" height="5" />
        <rect class="lanart-node-sq" x="899" y="219" width="12" height="12" /><rect class="lanart-node-core" x="902.5" y="222.5" width="5" height="5" />

        <rect class="lanart-node-sq" x="1299" y="229" width="12" height="12" /><rect class="lanart-node-core" x="1302.5" y="232.5" width="5" height="5" />
      </g>

      <g class="lanart-tag-plates">
        <path d="M905 231V242H928M1305 241V251H1328" />
        <rect x="928" y="234" width="44" height="16" /><text x="950" y="245" text-anchor="middle">A-03</text>
        <rect x="1328" y="243" width="44" height="16" /><text x="1350" y="254" text-anchor="middle">A-05</text>
      </g>

        <text x="540" y="214" text-anchor="middle">[ 22.54°N, 114.05°E ]</text>

        <text x="1085" y="176" text-anchor="middle">[ 31.23°N, 121.47°E ]</text>
        <text x="716" y="372">SECTOR 04 // TERRAIN ATLAS</text>
      </g>

      <g class="lanart-plate-numbers">
        <text x="480" y="152">01</text><line x1="480" y1="162" x2="516" y2="162" />
        <text x="1156" y="182">02</text><line x1="1156" y1="194" x2="1196" y2="194" />
        <text x="1148" y="346">03</text><line x1="1148" y1="358" x2="1188" y2="358" />
      </g>
      </svg>
    </div>

    <!-- Night Plate Wrapper (HTMLDivElement for deepscordTheme.animate contract) -->
    <div id="theme-lanart-plate-night" class="theme-lanart-plate theme-lanart-night-plate">
      <svg class="theme-lanart-svg" viewBox="0 0 1440 900" preserveAspectRatio="xMidYMin slice" fill="none" focusable="false">
      <defs>
        <linearGradient id="theme-lanart-night-disc" x1="0.2" y1="0.1" x2="0.8" y2="0.95">
          <stop offset="0" stop-color="#e94a4c" />
          <stop offset="1" stop-color="#c8363d" />
        </linearGradient>
        <radialGradient id="theme-lanart-night-halo" cx="0.5" cy="0.5" r="0.5">
          <stop offset="0" stop-color="#e34549" stop-opacity="0.26" />
          <stop offset="0.45" stop-color="#e34549" stop-opacity="0.08" />
          <stop offset="1" stop-color="#e34549" stop-opacity="0" />
        </radialGradient>
        <clipPath id="theme-lanart-disc-clip">
          <circle cx="1010" cy="236" r="190" />
        </clipPath>
        <pattern id="theme-lanart-night-grid" width="48" height="48" patternUnits="userSpaceOnUse">
          <path class="lanart-night-grid-line" d="M48 0H0V48" />
        </pattern>
      </defs>

      <!-- Observation Grid & Lower Planet-Limb Arc -->
      <rect width="1440" height="900" fill="url(#theme-lanart-night-grid)" />
      <path class="lanart-planet-limb" d="M180 920 A1180 420 0 0 1 1440 680" />
      <path class="lanart-ranging-arc" d="M510 140 A520 520 0 0 0 540 430" />

      <!-- Soft Halo & Crosshairs -->
      <circle cx="1010" cy="236" r="420" fill="url(#theme-lanart-night-halo)" />
      <line class="lanart-crosshair" x1="420" y1="236" x2="1440" y2="236" />
      <line class="lanart-crosshair" x1="1010" y1="0" x2="1010" y2="620" />

      <!-- Dominant Flat Red Disc + Eccentric Overlap Twin Lens -->
      <circle cx="1010" cy="236" r="190" fill="url(#theme-lanart-night-disc)" />
      <g clip-path="url(#theme-lanart-disc-clip)">
        <circle class="lanart-disc-lens" cx="1190" cy="346" r="190" />
      </g>
      <circle class="lanart-disc-twin-outline" cx="1190" cy="346" r="190" />

      <!-- Joined Tick Ring & State Dot -->
      <g class="lanart-tick-spin">
        <path class="lanart-tick-major" d="M1248 236h14M1216.1 355l12.1 7M1129 442.1l7 12.1M1010 474v14M891 442.1l-7 12.1M772 236h-14M803.9 117l-12.1-7M891 29.9l-7-12.1M1010 -2v-14M1129 29.9l7-12.1M1216.1 117l12.1-7" />
        <circle class="lanart-state-dot" cx="821" cy="419" r="4.5" />
      </g>

      <!-- Tilted Elliptical Orbits, Travelling Comets & White Satellite Anchor -->
      <g class="lanart-orbits" transform="rotate(-16 1010 236)">
        <ellipse cx="1010" cy="236" rx="430" ry="112" />
        <ellipse class="lanart-orbit-soft" cx="1010" cy="236" rx="560" ry="168" />
        <ellipse class="lanart-orbit-faint" cx="1010" cy="236" rx="300" ry="64" />
        <ellipse class="lanart-orbit-comet" cx="1010" cy="236" rx="430" ry="112" pathLength="1000" />
        <ellipse class="lanart-orbit-comet lanart-orbit-comet-slow" cx="1010" cy="236" rx="560" ry="168" pathLength="1000" />
        <!-- Single Craft Marker connected by dashed leader to Satellite Anchor -->
        <line class="lanart-craft-leader" x1="606" y1="198" x2="668" y2="142" />
        <rect class="lanart-craft-marker" x="665" y="139" width="6" height="6" />
        <circle class="lanart-satellite" cx="606" cy="198" r="5.5" />
        <circle class="lanart-satellite-ring" cx="606" cy="198" r="14" />
      </g>

      <!-- Deterministic Pixel Flicker Cluster & Plus Marks -->
      <g class="lanart-pixels">
        <rect class="lanart-pixel-light" x="828" y="302" width="8" height="8" />
        <rect class="lanart-pixel-light" x="838" y="302" width="4" height="4" />
        <rect class="lanart-pixel-dark" x="828" y="312" width="4" height="4" />
        <rect class="lanart-pixel-light" x="844" y="310" width="6" height="6" />
        <rect class="lanart-pixel-light" x="852" y="320" width="4" height="4" />
        <rect class="lanart-pixel-dark" x="836" y="322" width="6" height="6" />
        <rect class="lanart-pixel-light" x="862" y="328" width="4" height="4" />
        <rect class="lanart-pixel-light" x="846" y="330" width="3" height="3" />
        <rect class="lanart-pixel-light" x="812" y="292" width="4" height="4" />
        <rect class="lanart-pixel-light" x="858" y="340" width="6" height="6" />
      </g>
      <path class="lanart-plus-marks" d="M655 150h10M660 145v10M1415 78h10M1420 73v10M1360 470h10M1365 465v10M755 430h10M760 425v10M1175 40h10M1180 35v10" />

      <g class="lanart-night-labels">
        <text x="560" y="168">FIG.01 — OBSERVATION</text>
        <text x="560" y="184">GRID SYSTEMS ........ : 02</text>
        <text x="628" y="324">ORB / 0.42 · 16°</text>
        <text x="524" y="286">RNG // 292</text>
        <text x="1412" y="166" transform="rotate(90 1412 166)">SIGNAL / ANIMA-01</text>
      </g>
      </svg>
    </div>
  </div>

  <!-- 1. Top Calibration Navbar -->
  <header class="theme-lanart-navbar">
    <div class="theme-lanart-brand">
      <span class="theme-lanart-logo-mark" aria-hidden="true">
        <span class="theme-lanart-logo-inner"></span>
      </span>
      <div class="theme-lanart-brand-copy">
        <strong class="theme-lanart-title">LANART // DEEPSCORD</strong>
        <span class="theme-lanart-sub" aria-hidden="true">ANIMA DOCUMENTATION SYSTEM · REV. 2026</span>
      </div>
    </div>

    <div data-deepscord-slot="rail"></div>

    <!-- Altimeter & Presence Telemetry Readout -->
    <div class="theme-lanart-telemetry">
      <span id="theme-lanart-altimeter" class="theme-lanart-altimeter" aria-hidden="true">ORB // 799,000 km · ANIMA-01</span>
      <span class="theme-lanart-divider" aria-hidden="true"></span>
      <span id="theme-lanart-status" class="theme-lanart-status" role="status">正在连接</span>
      <span id="theme-lanart-count" class="theme-lanart-count">0 位成员</span>
    </div>

    <div class="theme-lanart-actions">
      <button id="theme-lanart-directory" type="button" data-theme-action="toggle-directory" aria-expanded="false">目录索引</button>
      <button id="theme-lanart-mode-toggle" type="button" class="theme-lanart-mode-btn" data-theme-action="toggle-mode" aria-pressed="true" title="切换白昼测绘地图册 / 暗夜轨道观测台">🌙 轨道 ORBIT ⇄ ☀️ 测绘</button>
      <button id="theme-lanart-density" type="button" data-theme-action="toggle-density" aria-pressed="false">紧凑视图</button>
      <button id="theme-lanart-settings" type="button" data-theme-action="settings">设置</button>
    </div>
  </header>

  <!-- 2. Sub-Header Hero Strip: Server Title + Docked Channel Topbar -->
  <div class="theme-lanart-hero-bar">
    <div class="theme-lanart-hero-identity">
      <span class="theme-lanart-kicker"><i aria-hidden="true"></i><span id="theme-lanart-mode-label">ORBITAL OBSERVATORY // 轨道观测</span></span>
      <h1 id="theme-lanart-server">Lanart</h1>
    </div>
    <div class="theme-lanart-channel-deck">
      <div class="theme-lanart-channel-badge">
        <span class="theme-lanart-channel-code" aria-hidden="true">NODE // 01</span>
        <strong id="theme-lanart-channel">等待频道</strong>
      </div>
      <div data-deepscord-slot="topbar"></div>
    </div>
  </div>

  <!-- 3. Left Directory Panel (Modeled after AnimaDocs `目录索引 / 01 LIVE` Card) -->
  <aside class="theme-lanart-directory">
    <div class="theme-lanart-card-header">
      <span class="theme-lanart-card-index">目录索引 / 01</span>
      <span class="theme-lanart-live-pill" aria-hidden="true">LIVE</span>
    </div>
    <div data-deepscord-slot="sidebar"></div>
  </aside>

  <!-- 4. Center Stage & Chat Viewport -->
  <main class="theme-lanart-main">
    <div data-deepscord-slot="radio"></div>
    <div data-deepscord-slot="content"></div>
  </main>

  <!-- 5. Right Member Telemetry Roster -->
  <aside class="theme-lanart-members">
    <div class="theme-lanart-card-header">
      <span class="theme-lanart-card-index">信号节点 / 02</span>
      <span class="theme-lanart-live-pill" aria-hidden="true">SYNC</span>
    </div>
    <div data-deepscord-slot="members"></div>
  </aside>

  <!-- 6. Bottom Instrument Footer -->
  <footer class="theme-lanart-footer">
    <div class="theme-lanart-footer-meta" aria-hidden="true">
      <span class="theme-lanart-square-dot"></span>
      <span>文档 · 测绘 · 轨道观测</span>
      <span class="theme-lanart-footer-line"></span>
      <span id="theme-lanart-coords">[ 39.90°N, 116.40°E // RNG 292 ]</span>
    </div>
    <div data-deepscord-slot="self"></div>
  </footer>
</section>
