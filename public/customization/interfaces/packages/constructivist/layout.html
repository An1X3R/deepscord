<section id="theme-constructivist" class="theme-newspaper" data-density="comfortable" data-directory="closed" aria-label="构成报刊开放主题">
  <header class="theme-newspaper-masthead">
    <div class="theme-newspaper-brand">
      <span class="theme-newspaper-a-card" aria-hidden="true">A</span>
      <strong class="theme-newspaper-wordmark">DEEPSCORD<span aria-hidden="true"> // </span><small>人们，我们</small></strong>
    </div>
    <div data-deepscord-slot="rail"></div>
    <div class="theme-newspaper-masthead-meta">
      <span id="theme-constructivist-status" role="status">正在连接</span>
      <span id="theme-constructivist-count">0 位成员</span>
    </div>
    <div class="theme-newspaper-masthead-actions">
      <button id="theme-constructivist-directory" type="button" data-theme-action="toggle-directory" aria-expanded="false">展开目录</button>
      <button id="theme-constructivist-density" type="button" data-theme-action="toggle-density" aria-pressed="false">紧凑排印</button>
      <button id="theme-constructivist-settings" type="button" data-theme-action="settings">设置 / ×</button>
    </div>
  </header>

  <div class="theme-newspaper-edition">
    <div class="theme-newspaper-pinboard">
      <span class="theme-newspaper-number" aria-hidden="true">№01</span>
      <div class="theme-newspaper-headline">
        <p><span class="theme-newspaper-cutout-tag">PEOPLE, A PEOPLE</span> 此刻，我们在这里</p>
        <div id="theme-constructivist-wedge" class="theme-newspaper-wedge-wrap">
          <h1 id="theme-constructivist-server">构成报刊</h1>
        </div>
      </div>
      <svg class="theme-newspaper-pinboard-svg" viewBox="0 0 220 64" aria-hidden="true">
        <polygon points="16,46 118,8 104,54" fill="#c83b32" fill-opacity="0.16" />
        <line x1="12" y1="50" x2="96" y2="12" stroke="#c83b32" stroke-width="1.8" />
        <line x1="96" y1="12" x2="164" y2="52" stroke="#171716" stroke-width="1.5" />
        <line x1="164" y1="52" x2="206" y2="18" stroke="#c83b32" stroke-width="1.8" />
        <circle cx="12" cy="50" r="3.5" fill="#f9f5ec" stroke="#171716" stroke-width="2" />
        <circle cx="96" cy="12" r="3.5" fill="#c83b32" stroke="#171716" stroke-width="2" />
        <circle cx="164" cy="52" r="3.5" fill="#f9f5ec" stroke="#171716" stroke-width="2" />
        <circle cx="206" cy="18" r="3.5" fill="#c83b32" stroke="#171716" stroke-width="2" />
      </svg>
    </div>
    <div class="theme-newspaper-topbar-bay">
      <div class="theme-newspaper-reading-header">
        <span class="theme-newspaper-channel-kicker" aria-hidden="true">КАНАЛ ↘</span>
        <span id="theme-constructivist-channel">等待频道</span>
      </div>
      <div data-deepscord-slot="topbar"></div>
    </div>
  </div>

  <aside class="theme-newspaper-directory">
    <div class="theme-newspaper-directory-heading">
      <strong>行动目录 // ОГЛАВЛЕНИЕ</strong>
      <span aria-hidden="true">◢</span>
    </div>
    <div data-deepscord-slot="sidebar"></div>
  </aside>

  <main class="theme-newspaper-reading">
    <div data-deepscord-slot="radio"></div>
    <div data-deepscord-slot="content"></div>
  </main>

  <aside class="theme-newspaper-members">
    <div class="theme-newspaper-members-heading">在场的人们 // ЛЮДИ</div>
    <div data-deepscord-slot="members"></div>
  </aside>

  <footer class="theme-newspaper-footer">
    <div class="theme-newspaper-footer-banner">
      <span class="theme-newspaper-wedge-badge" aria-hidden="true">▲</span>
      <span class="theme-newspaper-footer-note">破壁与营火余温 · 声音汇聚于此 <span aria-hidden="true">───→</span></span>
    </div>
    <div data-deepscord-slot="self"></div>
  </footer>
</section>
